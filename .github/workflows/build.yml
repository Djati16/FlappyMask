name: Build
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Compiler
        run: msbuild ide/MyLib.sln /p:Configuration=Release /p:Platform=x64
      - uses: actions/upload-artifact@v4
        with:
          name: FlappyMask
          path: ide/FlappyMask/x64/Release/FlappyMask.exe
